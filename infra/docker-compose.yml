version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: opssaathi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: opssaathi
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d opssaathi"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: opssaathi_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+psycopg://user:password@postgres:5432/opssaathi
      - VERIFIER_DATABASE_URL=postgresql+psycopg://verifier_ro:password@postgres:5432/opssaathi
    volumes:
      - ../services/api:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: opssaathi_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  postgres_data:
  web_node_modules:
